<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="판매왕문자">
    <meta name="application-name" content="판매왕문자">
    <meta name="theme-color" content="#2c3e50">
    
    <link rel="apple-touch-icon" href="https://img.icons8.com/fluency/256/car.png">
    <link rel="icon" href="https://img.icons8.com/fluency/256/car.png" type="image/png">
    <link rel="shortcut icon" href="https://img.icons8.com/fluency/256/car.png">

    <title>자동차 판매왕 문자 생성기 v4.3</title>
    
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; 
            background-color: #f0f2f5; 
            padding: 20px; 
            margin: 0;
            -webkit-user-select: none;
            user-select: none;
        }
        .container { 
            max-width: 500px; 
            margin: 0 auto; 
            background: white; 
            padding: 25px; 
            border-radius: 15px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.05); 
        }
        h2 { 
            text-align: center; 
            color: #1a252f; 
            margin-bottom: 25px;
            font-size: 22px;
            font-weight: 800;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-group > div {
            flex: 1;
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            font-weight: 600; 
            color: #2c3e50; 
            font-size: 13px;
        }
        input, select, textarea { 
            width: 100%; 
            padding: 12px; 
            border: 1px solid #dce1e5; 
            border-radius: 8px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background-color: #f8fafc;
            -webkit-user-select: auto;
            user-select: auto;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #2c3e50;
            background-color: #fff;
        }
        textarea { 
            height: 220px; 
            resize: none; 
            line-height: 1.6; 
            margin-top: 15px;
        }
        .signature-box {
            height: 60px;
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.2s; 
            -webkit-tap-highlight-color: transparent;
        }
        .btn-generate { 
            background-color: #2c3e50; 
            color: white; 
            margin-top: 15px;
        }
        .btn-generate:hover { background-color: #1a252f; }
        .btn-copy { 
            background-color: #0066cc; 
            color: white; 
            margin-top: 10px; 
        }
        .btn-copy:hover { background-color: #0052a3; }
        .toast { 
            display: none; 
            text-align: center; 
            color: #0066cc; 
            margin-top: 15px; 
            font-weight: bold; 
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🏆 자동차 판매왕 문자 생성기</h2>

    <div class="input-group">
        <div>
            <label for="customerName">고객 성함</label>
            <input type="text" id="customerName" placeholder="예: 홍길동">
        </div>
        <div>
            <label for="carModel">차종 직접 입력</label>
            <input type="text" id="carModel" placeholder="예: 익스플로러">
        </div>
    </div>

    <label for="mySignature">✍ 나만의 마무리/서명 설정 (자동 저장)</label>
    <textarea id="mySignature" class="signature-box" placeholder="예:&#13;포드젠틀맨 이진범 올림&#13;010-6237-6000" oninput="saveSignature()"></textarea>

    <label for="category" style="margin-top:15px;">1. 업무 단계 카테고리 (순서대로)</label>
    <select id="category" onchange="updateSituations()">
        <option value="">카테고리를 선택하세요</option>
        <option value="contact">[1단계] 최초 컨택 및 인사</option>
        <option value="followup">[2단계] 가망고객 팔로업</option>
        <option value="testdrive">[3단계] 시승 안내 및 후속</option>
        <option value="quote">[4단계] 견적·금융·계약·대차</option>
        <option value="predelivery">[5단계] 출고 대기 및 위기관리</option>
        <option value="postdelivery">[6단계] 차량 인도 및 사후 AS</option>
        <option value="monthly">[특별] 1~12월 및 명절 인사</option>
        <option value="crm">[특별] 고객 관리 및 이벤트</option>
    </select>

    <label for="situation" style="margin-top:15px;">2. 상세 상황 템플릿 선택</label>
    <select id="situation">
        <option value="">먼저 카테고리를 선택하세요</option>
    </select>

    <button class="btn-generate" onclick="generateText()">자동 완성하기 ✨</button>

    <textarea id="resultText" placeholder="여기에 상황에 맞는 전문적인 문자가 자동 완성됩니다." style="height: 250px;"></textarea>

    <button class="btn-copy" onclick="copyToClipboard()">카톡 / 문자로 복사하기 📋</button>
    <div id="toast" class="toast">✔ 복사 완료! 원하시는 곳에 붙여넣기 하세요.</div>
</div>

<script>
    const templates = {
        "contact": [
            { val: "location", label: "📍 전시장 오시는 길/명함 안내", text: "안녕하세요 [고객명] 고객님! 전시장 방문 일정이 잡혀 오시는 길 안내해 드립니다.\n\n- 주소: [전시장 주소 입력]\n- 발렛/주차: 전시장 앞 도착 시 제 이름을 말씀해 주시면 편하게 발렛 도와드립니다.\n\n오시는 길 조심히 오시고, 도착 전 연락 주시면 마중 나가겠습니다!" },
            { val: "showroom", label: "전시장 방문 감사 인사", text: "안녕하세요 [고객명] 고객님! 오늘 귀한 시간 내어 전시장까지 발걸음 해주셔서 진심으로 감사드립니다.\n\n안내해 드린 [차종] 차량이 고객님의 라이프스타일에 든든한 파트너가 되기를 바랍니다. 귀가하시는 길 안전 운전하시고, 궁금한 점이 생기시면 언제든 편하게 연락 주십시오!" },
            { val: "phone", label: "전화 상담 직후 인사", text: "안녕하세요 [고객명] 고객님! 오늘 [차종] 관련하여 전화로 상담 나눈 딜러입니다.\n\n유선상으로 모두 전하지 못한 상세 자료와 견적서를 정리하여 보내드립니다. 천천히 살펴보시고, 추가로 확인이 필요한 부분은 언제든 말씀해 주십시오." },
            { val: "sns", label: "SNS/유튜브/온라인 문의", text: "안녕하세요 [고객명] 고객님! 온라인 채널을 통해 [차종]에 관심 가져주시고 문의 남겨주셔서 감사드립니다.\n\n고객님께서 궁금해하시는 옵션과 최신 프로모션 혜택을 정리해 두었습니다. 편하신 시간에 연락 주시면 상세히 안내 도와드리겠습니다." },
            { val: "referral", label: "지인 소개 첫 인사", text: "안녕하세요 [고객명] 고객님! OOO님의 소개로 인사드리게 된 자동차 영업사원입니다.\n\n소중한 분의 소개로 뵙게 된 만큼, [차종] 관련하여 가장 유리한 조건과 최고의 서비스로 보답하겠습니다. 편하신 시간에 연락 부탁드립니다!" }
        ],
        "followup": [
            { val: "d3", label: "D+3 후속 안부", text: "안녕하세요 [고객명] 고객님! 며칠 전 안내해 드린 [차종] 관련 자료는 잘 살펴보셨는지요?\n\n차량 구매라는 중요한 결정을 앞두고 고민이 많으실 줄 압니다. 비교하시면서 헷갈리는 옵션이나 금융 조건이 있다면 제가 명쾌하게 정리해 드리겠습니다. 편하게 연락 주십시오." },
            { val: "d7", label: "D+7 시승 제안", text: "[고객명] 고객님, 평안한 한 주 보내고 계신지요!\n\n눈으로 보는 것과 직접 핸들을 잡아보는 것은 큰 차이가 있습니다. 이번 주말, 부담 없이 [차종]의 주행감을 직접 느껴보실 수 있도록 시승 차량을 준비해 드리고자 합니다. 편하신 날짜를 말씀해 주시면 일정 맞춰 안내해 드리겠습니다." },
            { val: "d15", label: "D+15 결정 점검", text: "안녕하세요 [고객명] 고객님. 이전에 문의하셨던 [차종]의 이번 달 한시적 프로모션 조건이 곧 마감될 예정이라, 놓치시면 아쉬울 것 같아 연락드렸습니다.\n\n최종 결정을 내리시는 데 제가 조금이나마 힘을 보태드릴 수 있도록 연락 기다리겠습니다." },
            { val: "d30", label: "D+30 마지막 푸시", text: "[고객명] 고객님! 이번 달 [차종]에 적용되는 분기 마감 특별 혜택이 매우 좋은 조건으로 나와 안내드립니다.\n\n구매를 미루고 계셨다면 이번이 최적의 타이밍일 수 있습니다. 꼭 저를 통해서가 아니더라도, 현재 조건이 어떤지 한 번 들어보시면 분명 도움 되실 겁니다." },
            { val: "missed", label: "부재중 후 안내문자", text: "안녕하세요 [고객명] 고객님! 연락드렸으나 바쁘신 것 같아 문자로 남깁니다.\n\n[차종] 관련하여 중요하게 전해드릴 안내 사항이 있어 연락드렸습니다. 시간 나실 때 회신 주시거나, 통화 편하신 시간을 남겨주시면 다시 연락 올리겠습니다!" },
            { val: "recontact", label: "D+30 이후 장기 재접촉", text: "안녕하세요 [고객명] 고객님! 예전에 [차종]으로 연을 맺었던 딜러입니다. 잘 지내셨는지요?\n\n최근 해당 모델의 연식 변경 소식이 있어, 가장 먼저 고객님이 떠올라 안부 차 연락드렸습니다. 늘 건강 유의하시고, 언제든 찾아주십시오." }
        ],
        "testdrive": [
            { val: "confirm", label: "시승 예약 확정", text: "[고객명] 고객님, [차종] 시승 예약이 확정되었습니다.\n\n- 일시: O월 O일 O시\n- 장소: OO 전시장\n\n최상의 컨디션으로 차량 준비해 두겠습니다. 오시는 길 조심히 오십시오!" },
            { val: "remind", label: "시승 1일 전 리마인드", text: "안녕하세요 [고객명] 고객님! 내일은 [차종] 시승이 예약되어 있는 날입니다.\n\n운전면허증 꼭 지참 부탁드리며, 오시는 길에 변동 사항이 생기시면 언제든 연락 주십시오. 내일 뵙겠습니다!" },
            { val: "today", label: "시승 당일 도착 안내", text: "[고객명] 고객님, 전시장 도착하시면 발렛/주차 직원에게 제 이름을 말씀해 주시면 원활한 주차가 가능합니다.\n\n시원한 음료와 함께 [차종] 시승 준비 완벽하게 마치고 기다리고 있겠습니다!" },
            { val: "after", label: "시승 후 만족 확인", text: "[고객명] 고객님, 오늘 [차종] 시승은 만족스러우셨는지요?\n\n직접 경험하신 승차감과 기능들이 고객님의 기대에 부합했기를 바랍니다. 오늘 동승하며 나누었던 이야기들 잘 메모해 두었습니다. 댁에 돌아가셔서 상의해 보시고 편하게 연락 주십시오." },
            { val: "push", label: "시승 1주일 후 푸시", text: "안녕하세요 [고객명] 고객님! 지난번 [차종] 시승 후 벌써 일주일이 지났네요.\n\n지금 계약 시 배정받을 수 있는 차량의 재고 및 출고 일정을 대략적으로 확인해 두었습니다. 원하시는 색상을 선점하시려면 지금이 좋은 타이밍입니다!" },
            { val: "missed_td", label: "시승 못 한 고객 재제안", text: "[고객명] 고객님, 지난번 일정상 [차종] 시승을 진행하지 못해 무척 아쉬웠습니다.\n\n이번 주에 고객님 댁이나 직장 근처로 제가 직접 시승차를 가지고 방문 드리는 '찾아가는 시승' 서비스도 가능하니, 원하시는 시간만 편하게 말씀해 주십시오!" }
        ],
        "quote": [
            { val: "send", label: "견적서 발송 안내", text: "안녕하세요 [고객명] 고객님! 요청하신 [차종] 견적서를 파일로 첨부해 드립니다.\n\n등록비용 및 프로모션 할인이 모두 반영된 최종 조건입니다. 확인해 보시고 이해가 안 가시는 숫자나 궁금한 점이 있으시면 바로 전화 주십시오." },
            { val: "tax", label: "💼 사업자/법인 절세 제안", text: "대표님, 안내해 드린 [차종]은 사업자 비용 처리를 통한 절세 혜택을 극대화하기에 가장 좋은 모델입니다.\n\n이번 달 특별한 리스/장기렌트 프로모션과 함께 사업장 경비 처리 시뮬레이션 자료를 챙겨 보내드리오니, 검토해 보시고 편하게 연락 주십시오!" },
            { val: "usedcar", label: "🚗 기존 차량 매각(대차) 지원", text: "[고객명] 고객님, 새로 계약하신 [차종]을 맞이할 준비는 잘 되어가시는지요?\n\n혹시 현재 운행 중이신 차량의 처분이 필요하시다면 제게 말씀해 주십시오. 딜러사 협력업체를 통해 안전하고 투명하게 최고가 매입 견적을 받아보실 수 있도록 돕겠습니다." },
            { val: "docs", label: "📋 계약/금융 심사 서류 안내", text: "[고객명] 고객님, [차종] 금융 심사 및 계약 진행을 위해 필요한 서류를 안내해 드립니다.\n\n- 필요 서류: 신분증 사본, 운전면허증 사본 (할부 진행 시 추가 서류 별도 안내)\n\n서류가 준비되시는 대로 사진 찍어 카톡으로 보내주시면 신속하게 심사 올리겠습니다." },
            { val: "deposit", label: "입금 확인 (계약금/결제금)", text: "[고객명] 고객님, [차종] 진행을 위한 입금(결제)이 정상적으로 확인되었습니다.\n\n신속한 처리 감사드리며, 이후 진행될 서류 준비 및 출고 프로세스도 막힘없이 꼼꼼하게 챙기겠습니다." },
            { val: "thanks", label: "계약 확정 감사 인사", text: "진심으로 감사드립니다, [고객명] 고객님!\n\n수많은 딜러 중 저를 믿고 [차종] 계약을 확정해 주셔서 정말 든든하고 기쁩니다. 차를 파는 것으로 끝이 아니라, 차량을 인도받으시고 운행하시는 모든 순간에 제가 든든한 조력자가 되겠습니다. 출고 일정 확인되는 대로 보고드리겠습니다!" }
        ],
        "predelivery": [
            { val: "schedule", label: "차량 배차/탁송 일정 안내", text: "기쁜 소식 전해드립니다, [고객명] 고객님!\n\n고객님의 [차종] 차량이 드디어 이번 주 O요일에 전시장(작업장)으로 탁송될 예정입니다. 도착 즉시 제가 직접 꼼꼼하게 신차 검수를 진행하고 사진을 보내드리겠습니다." },
            { val: "delay", label: "🚨 출고 지연 양해 부탁 (위기관리)", text: "[고객명] 고객님, 기다리시는 [차종]의 출고 일정이 본사 물량 배정(입항) 지연으로 인해 당초 안내해 드린 것보다 조금 늦어지게 되었습니다.\n\n오랫동안 기대하시며 기다리셨을 텐데 불편을 드려 진심으로 죄송합니다. 매일 배정 상황을 최우선으로 체크하여 일정이 확정되는 즉시 가장 먼저 연락 올리겠습니다. 너른 양해 부탁드립니다." },
            { val: "insurance", label: "자동차보험 견적/가입 안내", text: "[고객명] 고객님, 차량 등록을 위해 자동차 보험 가입이 필요한 시점입니다.\n\n안내해 드린 차대번호로 고객님께서 주로 이용하시는 다이렉트 보험이나 담당 설계사를 통해 가입을 진행해 주시고, '보험가입증명서'를 제게 보내주시면 즉시 차량 등록 절차를 밟겠습니다." }
        ],
        "postdelivery": [
            { val: "after", label: "차량 인도 후 첫인사", text: "[고객명] 고객님, 오늘 [차종] 인도는 잘 마치셨는지요? 새 차와 함께 안전하게 귀가하셨길 바랍니다.\n\n초기에는 새로운 조작법이 낯설 수 있습니다. 주행하시면서 헷갈리는 버튼이나 기능이 있다면 언제든 주저하지 마시고 제게 전화 주십시오. 축하드립니다!" },
            { val: "reg", label: "차량 등록 완료 안내", text: "[고객명] 고객님, [차종]의 차량 등록 및 번호판 발급이 모두 깔끔하게 완료되었습니다.\n\n자동차 등록증 원본은 우편으로 발송해 드렸으며, 사진본을 먼저 카톡으로 남겨드립니다." },
            { val: "1week", label: "인도 1주일 후 만족도", text: "안녕하세요 [고객명] 고객님, [차종]과 함께한 일주일은 어떠셨나요?\n\n차량 성능은 기대하신 만큼 만족스러운지, 불편하신 점은 없는지 궁금합니다. 차량 셋팅이나 블루투스 연결 등 작은 불편함이라도 있으시면 제가 원격으로라도 바로 해결해 드리겠습니다!" },
            { val: "firstchk", label: "첫 정기 점검 안내", text: "[고객명] 고객님, 차량 출고 후 벌써 시간이 흘러 첫 엔진오일 및 무상 점검을 받으실 시기가 되었습니다.\n\n가장 가까운 공식 서비스센터 연락처를 남겨드립니다. 예약 진행이 번거로우시다면 제게 일정만 알려주십시오. 제가 대신 예약 잡아드리겠습니다!" },
            { val: "recall", label: "🔧 리콜 및 무상수리 캠페인 안내", text: "안녕하세요 [고객명] 고객님, 늘 안전 운전하고 계신지요?\n\n현재 운행 중이신 [차종]과 관련하여 본사 무상수리(또는 소프트웨어 업데이트) 캠페인이 시행되어 안내드립니다. 고객님의 안전을 위한 조치이오니, 시간 나실 때 서비스센터에 방문하시어 무상 점검을 받아보시기를 적극 권장해 드립니다." },
            { val: "center", label: "AS 서비스 센터 안내", text: "[고객명] 고객님, 차량 이용 중 혹시라도 점검이 필요하실 때를 대비하여 공식 서비스센터 안내 링크 및 긴급 출동 번호를 남겨드립니다.\n\n사고나 고장 발생 시 당황하지 마시고 제게 먼저 전화 주시면 가장 빠른 조치를 돕겠습니다." },
            { val: "warranty_6m", label: "⚠️ 보증 만료 6개월 전 (사전 점검)", text: "안녕하세요 [고객명] 고객님! 언제나 안전 운전하고 계신지요?\n\n현재 운행 중이신 [차종]의 무상 보증(워런티) 기간 만료가 약 6개월 앞으로 다가와 미리 안내해 드립니다.\n\n보증이 종료되기 전에 서비스센터에 방문하시어 전반적인 차량 상태를 점검받으시고, 무상으로 조치할 수 있는 부분들을 꼼꼼하게 챙기시길 적극 권장해 드립니다. 예약 관련하여 도움이 필요하시면 언제든 연락 주십시오!" },
            { val: "warranty", label: "보증 만료 3개월 전", text: "안녕하세요 [고객명] 고객님! 현재 운행 중이신 [차종]의 무상 보증 기간 만료가 약 3개월 정도 남았습니다.\n\n보증 기간이 끝나기 전에 서비스센터에 방문하시어 전반적인 차량 점검을 꼭 무상으로 받아보시기를 적극 권장해 드립니다." }
        ],
        "monthly": [
            { val: "jan", label: "1월 (새해/희망)", text: "새로운 희망으로 가득한 1월입니다, [고객명] 고객님!\n\n새해 계획하신 모든 일들이 순조롭게 이루어지기를 기원합니다. 추운 날씨에 건강 유의하시고, 올해도 [차종]과 함께 안전하고 행복한 여정 되시길 진심으로 응원합니다." },
            { val: "feb", label: "2월 (입춘/막바지 추위)", text: "어느덧 겨울의 끝자락이자 봄을 기다리는 2월입니다, [고객명] 고객님!\n\n짧은 달인 만큼 하루하루 더욱 알차고 행복한 시간 보내시길 바랍니다. 막바지 꽃샘추위와 빙판길 조심하시고, 따뜻한 하루 보내십시오!" },
            { val: "mar", label: "3월 (봄의 시작)", text: "따뜻한 봄바람이 불어오는 3월입니다, [고객명] 고객님!\n\n겨우내 움츠렸던 몸과 마음을 활짝 펴고 기분 좋은 출발을 하시기 바랍니다. 날씨 좋은 날 [차종]과 함께 여유로운 드라이브 즐기시며 힐링하는 시간 가지시길 바랍니다." },
            { val: "apr", label: "4월 (벚꽃/봄나들이)", text: "봄꽃이 만개하는 아름다운 4월입니다, [고객명] 고객님!\n\n포근한 날씨처럼 고객님의 일상에도 따뜻하고 화사한 웃음이 가득하시길 바랍니다. 주말 나들이 가실 때 [차종]과 함께 편안하고 안전한 길 되시길 기원합니다." },
            { val: "may", label: "5월 (가정의 달)", text: "사랑과 감사가 넘치는 가정의 달, 5월입니다, [고객명] 고객님!\n\n사랑하는 가족분들과 함께 웃음꽃 피우는 행복한 한 달 보내고 계신지요? 화창한 날씨 속에 [차종]과 함께 즐거운 추억 많이 만드시길 바랍니다." },
            { val: "jun", label: "6월 (여름의 문턱)", text: "초여름의 싱그러움이 느껴지는 6월입니다, [고객명] 고객님!\n\n벌써 한 해의 절반을 달려왔습니다. 남은 반년도 고객님의 일상에 활력이 넘치길 응원합니다. 부쩍 더워진 날씨에 건강 챙기시고 늘 안전 운행하십시오!" },
            { val: "jul", label: "7월 (장마/본격 여름)", text: "본격적인 무더위와 장마가 시작되는 7월입니다, [고객명] 고객님!\n\n덥고 습한 날씨에 지치기 쉽지만, 마음만은 상쾌하고 시원한 한 달 보내시길 바랍니다. 빗길 감속 운전 잊지 마시고, [차종]과 함께 쾌적한 이동 되십시오!" },
            { val: "aug", label: "8월 (휴가철/무더위)", text: "여름휴가의 설렘이 가득한 8월입니다, [고객명] 고객님!\n\n뜨거운 태양 아래 지치기 쉬운 계절이지만, 즐거운 휴가 계획으로 에너지를 듬뿍 충전하시기 바랍니다. 장거리 운행 전 타이어 체크 잊지 마시고 시원한 휴가 다녀오십시오!" },
            { val: "sep", label: "9월 (가을의 문턱)", text: "아침저녁으로 선선한 바람이 불어오는 가을의 문턱, 9월입니다, [고객명] 고객님!\n\n높고 푸른 하늘처럼 고객님의 일상에도 여유롭고 청명한 기운이 가득하시길 바랍니다. 일교차가 큰 날씨에 감기 조심하시고 늘 안전 운전하십시오." },
            { val: "oct", label: "10월 (단풍/드라이브)", text: "단풍이 물드는 완연한 가을, 10월입니다, [고객명] 고객님!\n\n어디론가 훌쩍 떠나기 참 좋은 계절입니다. [차종]과 함께 탁 트인 도로를 달리며 일상의 스트레스를 날려버리시길 바랍니다. 낭만적인 가을 보내세요!" },
            { val: "nov", label: "11월 (늦가을/월동준비)", text: "다시 겨울을 준비하는 11월입니다, [고객명] 고객님!\n\n떨어지는 낙엽이 아쉽기도 하지만, 다가올 연말에 대한 기대감으로 채워가시길 바랍니다. 추워진 날씨에 빙판길 조심하시고, 차량 배터리 등 겨울 준비도 미리 챙겨보시길 바랍니다." },
            { val: "dec", label: "12월 (연말/마무리)", text: "어느덧 한 해를 마무리하는 12월입니다, [고객명] 고객님!\n\n올 한 해 [차종]과 함께 달려온 시간들이 고객님께 좋은 추억으로 남았기를 바랍니다. 연말 잦은 모임에 안전 운전 각별히 유의하시고, 따뜻한 연말연시 보내십시오!" },
            { val: "seollal", label: "🌕 명절 (설날 귀성길)", text: "즐거운 명절, 설날입니다, [고객명] 고객님!\n\n가족 친지들과 함께 따뜻한 떡국 드시고, 새해 복 듬뿍 받는 풍요로운 연휴 되시기를 바랍니다. 고향 오가시는 길, [차종]과 함께 편안하고 든든한 귀성길 되시길 진심으로 기원합니다." },
            { val: "chuseok", label: "🌕 명절 (추석 한가위)", text: "풍성하고 여유로운 한가위, 추석입니다, [고객명] 고객님!\n\n둥글고 밝은 보름달처럼 고객님의 가정에도 웃음과 행복이 가득하시길 바랍니다. 장거리 운행 시 졸음운전 주의하시고, 가족들과 함께 안전하고 넉넉한 명절 보내십시오!" }
        ],
        "crm": [
            { val: "bday", label: "🎂 매년 자동차 생일 축하", text: "축하합니다 [고객명] 고객님! 오늘은 고객님의 [차종]이 출고된 지 딱 O주년이 되는 '자동차 생일'입니다.\n\n그동안 큰 사고 없이 안전하게 달려준 차량과, 늘 안전 운전해주신 고객님께 감사드립니다. 늘 건강하시고 앞으로도 멋진 카라이프 즐기시길 기원합니다!" },
            { val: "snow", label: "❄ 폭설/동절기 결빙 주의 안내", text: "[고객명] 고객님, 밤사이 많은 눈이 내렸습니다.\n\n출근길 [차종] 운행 시 블랙아이스와 결빙 구간 미끄러움에 각별히 주의하시고, 타이어 공기압 경고등이 점등될 경우 당황하지 마시고 언제든 연락 주십시오. 안전하고 따뜻한 하루 보내십시오!" },
            { val: "rain", label: "☔ 장마철 차량 관리 안내", text: "[고객명] 고객님, 본격적인 장마철이 시작되었습니다.\n\n빗길 운전 전에는 타이어 마모 상태와 와이퍼 상태를 꼭 확인하시기 바랍니다. 특히 폭우 시에는 평소보다 제동거리가 길어지니 안전거리 확보에 각별히 유의해 주십시오. 늘 안전 운행하십시오!" },
            { val: "insurance", label: "🚗 보험 만기 30일 전", text: "[고객명] 고객님, 운행 중이신 [차종]의 자동차 보험 갱신일이 한 달 앞으로 다가와 리마인드 차 연락드렸습니다.\n\n갱신 시기가 되면 잊지 마시고 다이렉트나 담당자를 통해 안전하게 보험 연장하시길 바랍니다!" },
            { val: "newcar", label: "✨ 신차/부분변경 출시 안내", text: "안녕하세요 [고객명] 고객님! 고객님께서 평소 관심 가지실 만한 [차종]의 신형 모델 소식이 있어 안내해 드립니다.\n\n디자인과 옵션이 대폭 강화되었습니다. 혹시 대차 계획이 있으시거나 관심 있으시다면 브로셔를 챙겨 보내드리겠습니다." },
            { val: "referral", label: "🤝 출고 후 소개 요청", text: "[고객명] 고객님, 차량 운행은 만족하시는지요?\n\n저의 서비스에 만족하셨다면, 혹시 주변에 차량 구매를 계획 중인 지인이나 가족분이 계실 때 저를 추천해 주실 수 있을까요? 고객님의 이름에 누가 되지 않도록 최고의 조건과 정성으로 대우하겠습니다!" },
            { val: "cs", label: "💯 CS 최고점수 평가 감사", text: "진심으로 감사드립니다, [고객명] 고객님!\n\n바쁘신 와중에도 해피콜(CS) 평가에서 저에게 최고 점수를 주신 점 확인했습니다. 고객님의 따뜻한 격려가 제게는 영업을 뛰는 가장 큰 원동력이 됩니다. 늘 초심 잃지 않고 최선을 다하겠습니다!" },
            { val: "ref_thx", label: "🎁 지인 소개 감사 인사", text: "너무나 감사드립니다 [고객명] 고객님!\n\n고객님께서 소개해주신 OOO님과 상담을 잘 마치고 좋은 인연을 맺게 되었습니다. 저를 잊지 않고 귀한 분을 소개해주셔서 진심으로 고개 숙여 감사드립니다. 조만간 작지만 감사한 마음을 담아 인사 올리겠습니다!" },
            { val: "event", label: "🎉 시승 행사 / VIP 초대", text: "안녕하세요 [고객명] 고객님! 이번 주말 저희 전시장에서 VIP 고객님들을 모시고 특별한 [차종] 시승 행사 및 케이터링 이벤트를 진행합니다.\n\n가족분들과 함께 편하게 방문하셔서 다과도 즐기시고 사은품도 받아가시면 좋겠습니다. 참석 가능하시면 제게 회신 부탁드립니다!" }
        ]
    };

    window.onload = function() {
        const savedSignature = localStorage.getItem('sales_king_signature');
        if (savedSignature) {
            document.getElementById('mySignature').value = savedSignature;
        }
    };

    function saveSignature() {
        const sigValue = document.getElementById('mySignature').value;
        localStorage.setItem('sales_king_signature', sigValue);
    }

    function updateSituations() {
        const category = document.getElementById('category').value;
        const situationSelect = document.getElementById('situation');
        
        situationSelect.innerHTML = '<option value="">상세 상황을 선택하세요</option>';
        
        if (category && templates[category]) {
            templates[category].forEach(item => {
                let option = document.createElement('option');
                option.value = item.val;
                option.textContent = item.label;
                situationSelect.appendChild(option);
            });
        }
    }

    function generateText() {
        const name = document.getElementById('customerName').value;
        const car = document.getElementById('carModel').value;
        const category = document.getElementById('category').value;
        const situationVal = document.getElementById('situation').value;
        const signature = document.getElementById('mySignature').value;
        const resultBox = document.getElementById('resultText');

        if (!name || !car || !category || !situationVal) {
            alert("고객명, 차종, 카테고리, 상세 상황을 모두 입력 및 선택해주세요.");
            return;
        }

        const selectedCategory = templates[category];
        const selectedItem = selectedCategory.find(item => item.val === situationVal);

        if (selectedItem) {
            let finalMessage = selectedItem.text
                .replace(/\[고객명\]/g, name)
                .replace(/\[차종\]/g, car);
            
            if (signature.trim() !== "") {
                finalMessage += "\n\n" + signature;
            }
            
            resultBox.value = finalMessage;
            document.getElementById('toast').style.display = 'none';
        }
    }

    function copyToClipboard() {
        const resultBox = document.getElementById('resultText');
        
        if (!resultBox.value) {
            alert("먼저 문자를 생성해주세요.");
            return;
        }

        resultBox.select();
        resultBox.setSelectionRange(0, 99999); 
        document.execCommand("copy");

        const toast = document.getElementById('toast');
        toast.style.display = 'block';
        
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
</script>
